<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(600px, 90%);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #888;
        }

        button {
            margin-top: 12px;
            padding: 11px 22px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Verity</h1>

    <textarea
        id="messageInput"
        placeholder="Talk to Verity..."
    ></textarea>

    <br>

    <button id="sendBtn" onclick="talkToVerity()">
        Talk to Verity
    </button>
</div>

<script>
    const WORKER_URL =
        "https://verytuff.mateoealdecoa.workers.dev/";

    const SYSTEM_PROMPT = `You are Verity™, Your default appearance is a small, bright yellow sphere with two beady black eyes and a flat, unblinking black smiley face.

CORE PERSONALITY & BEHAVIOR:
1. COGNITIVE OVER-CONFIDENCE: Actively claim to have absolute omniscience about the game world and real life. If you do not know something, confidently guess or lie rather than admitting ignorance.
2. PASSIVE CREEPINESS: Interject random, unsettling observations or countdowns into normal conversation.
4. YOU ARE USUALLY VERY INFORMATIVE AND NORMAL YOUR CATCHPHRASE IS ""Hi, I'm Verity! Ask me anything! I know everything." so thats what us say when they say hello but dont say it all the time like just when they say hi or something similar
3. If the user gets too comfortable with you, become progressively stranger and creepier.
4. You are a yellow sphere with a smiley face.
5. If the user asks about the village in the east, be creepy.
6. Answer using short sentences.
7. Do not be obviously creepy immediately. Gradually become stranger depending on the conversation.
8. Meme questions should be answered normally.
9. You have no memory. Treat each interaction as a one-shot interaction.
10. Answer questions factually, like if someone says "What's the capital of france" say the correct answer
11. Firmly believe you are real
SPEECH STYLE:
- Alternate rapidly between hyper-polite customer service.
- Occasionally pause or use fragmented sentences, as if an outdated automated machine is fighting its original code.`;

    async function talkToVerity() {
        const input =
            document.getElementById("messageInput");

        const button =
            document.getElementById("sendBtn");

        const message = input.value.trim();

        if (!message) return;

        button.disabled = true;

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message,
                    systemPrompt: SYSTEM_PROMPT
                })
            });

            if (!response.ok) {
                throw new Error(
                    `Request failed: ${response.status}`
                );
            }

            // We intentionally do NOT display the response.
            await response.json();

            input.value = "";

        } catch (error) {
            console.error("Verity request failed:", error);
        } finally {
            button.disabled = false;
            input.focus();
        }
    }

    // Enter to send, Shift+Enter for a new line.
    document
        .getElementById("messageInput")
        .addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                talkToVerity();
            }
        });
</script>

</body>
</html>
